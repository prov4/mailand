syntax = "proto3";

// Single source of truth for the mailand-daemon <-> mailand-ui IPC contract.
// Transport: gRPC over a Unix domain socket at $XDG_RUNTIME_DIR/mailand.sock.

package mailand.v1;
option go_package = "mailand/backend/internal/rpc/pb;pb";

service MailandService {
  // Accounts & Folders
  rpc ListAccounts(Empty) returns (AccountList);
  rpc ListFolders(AccountRequest) returns (FolderList);

  // Mail Operations
  rpc ListMessages(ListMessagesRequest) returns (MessageHeaderList);
  rpc GetMessage(MessageRequest) returns (MessageDetail);
  rpc GetAttachment(AttachmentRequest) returns (AttachmentData);
  rpc SearchMessages(SearchRequest) returns (MessageHeaderList);
  rpc SetMessageFlags(SetFlagsRequest) returns (Empty);
  rpc ArchiveMessages(ArchiveRequest) returns (Empty);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc TriggerSync(AccountRequest) returns (Empty); // mail, calendars and contacts

  // Calendars & Contacts (read-only, synced from CalDAV/CardDAV)
  rpc ListCalendars(Empty) returns (CalendarList);
  rpc ListEvents(ListEventsRequest) returns (EventList);
  rpc ListContacts(ListContactsRequest) returns (ContactList);
  // Create (empty contact_id: in account_id's address book) or update a
  // contact; written to the server, then returned. ABORTED: changed on the server.
  rpc SaveContact(SaveContactRequest) returns (Contact);
  rpc DeleteContact(ContactRequest) returns (Empty);
  // Newest messages from/to/cc any of the addresses (contact details).
  rpc ListMessagesByAddress(AddressMessagesRequest) returns (MessageHeaderList);
  // Accept / maybe / decline an invitation (the whole series). The server
  // notifies the organizer. ABORTED: the event changed on the server meanwhile.
  rpc RespondToEvent(RespondToEventRequest) returns (Empty);

  // Real-time Push Events (New mail, sync status, flag updates)
  rpc SubscribeEvents(Empty) returns (stream DaemonEvent);
}

message Empty {}

message AccountRequest {
  string account_id = 1;
}

message Account {
  string id = 1;
  string name = 2;
  string email = 3;
  string signature = 4;
}

message AccountList {
  repeated Account accounts = 1;
}

message Folder {
  string id = 1;
  string account_id = 2;
  string name = 3;
  string path = 4;
  uint32 unread_count = 5;
  string kind = 6;        // "folder" | "gmail_label"
  string special_use = 7; // "\\Inbox", "\\Sent", "\\Drafts", "\\Trash", "\\Junk", "\\All", "\\Flagged"; "" if none
}

message FolderList {
  repeated Folder folders = 1;
}

message ListMessagesRequest {
  string folder_id = 1;
  uint32 limit = 2;
  uint32 offset = 3;
  bool unread_only = 4;
}

message MessageHeader {
  string id = 1;
  string folder_id = 2;
  uint32 uid = 3;
  string subject = 4;
  string from_name = 5;
  string from_address = 6;
  int64 timestamp_unix = 7;
  bool is_read = 8;
  bool is_flagged = 9;
  bool has_attachments = 10;
  string snippet = 11;
  repeated string folder_ids = 12; // all folders/labels this message appears in
  bool is_answered = 13;
}

message MessageHeaderList {
  repeated MessageHeader messages = 1;
  uint32 total_count = 2;
}

message MessageRequest {
  string message_id = 1;
}

message AttachmentInfo {
  string id = 1;
  string filename = 2;
  string mime_type = 3;
  uint64 size_bytes = 4;
  string content_id = 5; // Content-ID without angle brackets; "" if none
  bool inline = 6;       // referenced via cid: from the HTML body
}

message AttachmentRequest {
  string message_id = 1;
  string attachment_id = 2; // AttachmentInfo.id (MIME part path, e.g. "1.2")
}

// Decoded part content. The server caps data at 50 MiB (ResourceExhausted above).
message AttachmentData {
  AttachmentInfo info = 1;
  bytes data = 2;
}

message MessageDetail {
  MessageHeader header = 1;
  repeated string to_addresses = 2;
  repeated string cc_addresses = 3;
  string text_body = 4;
  string html_body = 5;
  repeated AttachmentInfo attachments = 6;
}

message SearchRequest {
  string query = 1;
  string account_id = 2; // Optional filter
  uint32 limit = 3;
  bool unread_only = 4;
}

message SetFlagsRequest {
  repeated string message_ids = 1;
  optional bool is_read = 2;
  optional bool is_flagged = 3;
}

message ArchiveRequest {
  repeated string message_ids = 1;
}

message SendAttachment {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
}

// Address strings in to/cc/bcc are "Name <addr>" or "addr". Errors: InvalidArgument for
// unknown account / bad or empty recipients / recipient rejected by the SMTP server,
// Unauthenticated (message "reauth_required" when the user must log in again),
// Unavailable for network failures, FailedPrecondition if sending is not configured.
message SendMessageRequest {
  string account_id = 1;
  repeated string to = 2;
  repeated string cc = 3;
  string subject = 4;
  string text_body = 5;
  string html_body = 6;
  string in_reply_to = 7;    // raw Message-ID fallback; reply_to_id takes precedence
  repeated string bcc = 8;   // envelope only, never written into headers
  string reply_to_id = 9;    // mailand message id being replied to: the server derives In-Reply-To
                             // (original Message-ID) and References (original References + Message-ID)
  string forward_of_id = 10; // mailand message id being forwarded: the server attaches the
                             // original's non-inline attachments
  repeated SendAttachment attachments = 11; // user-attached files
}

message SendMessageResponse {
  string message_id_header = 1; // Message-ID of the sent mail, without angle brackets
}

message DaemonEvent {
  enum Type {
    SYNC_STARTED = 0;
    SYNC_FINISHED = 1;
    NEW_MESSAGES = 2;
    FLAGS_UPDATED = 3;
    ERROR = 4;
    // detail: messages still to download in folder_id (initial/backlog sync).
    // SYNC_FINISHED with detail "backlog" means another pass follows at once.
    SYNC_PROGRESS = 5;
    CALENDARS_UPDATED = 6; // calendars or events of account_id changed
    CONTACTS_UPDATED = 7;  // address books or contacts of account_id changed
  }
  Type type = 1;
  string account_id = 2;
  string folder_id = 3;
  string detail = 4;
}

message Calendar {
  string id = 1;
  string account_id = 2;
  string name = 3;
  string color = 4; // "#rrggbb", or "" (the UI picks one)
  bool read_only = 5;
}

message CalendarList {
  repeated Calendar calendars = 1;
}

message ListEventsRequest {
  int64 start_unix = 1;              // inclusive
  int64 end_unix = 2;                // exclusive; at most 400 days after start
  repeated string calendar_ids = 3;  // empty = all calendars
}

// One occurrence of an event; recurring events are expanded by the daemon.
message CalendarEvent {
  string id = 1;          // unique per occurrence
  string calendar_id = 2;
  string uid = 3;         // iCalendar UID (shared by all occurrences)
  string summary = 4;
  string location = 5;
  string description = 6;
  int64 start_unix = 7;
  int64 end_unix = 8;     // exclusive; all-day events end at local midnight
  bool all_day = 9;
  bool recurring = 10;
  string organizer = 11;      // display name, or the address
  string status = 12;         // "CONFIRMED", "TENTATIVE" or ""
  string organizer_email = 13;
  repeated Attendee attendees = 14;
  string my_status = 15;      // the account's PARTSTAT ("NEEDS-ACTION", "ACCEPTED", ...); "" if not invited
  bool can_respond = 16;      // invited, not the organizer, calendar writable
}

message Attendee {
  string name = 1;
  string email = 2;
  string status = 3;  // PARTSTAT: NEEDS-ACTION | ACCEPTED | TENTATIVE | DECLINED | DELEGATED
  string role = 4;    // REQ-PARTICIPANT | OPT-PARTICIPANT | CHAIR | NON-PARTICIPANT
  bool is_me = 5;     // the calendar's own account
}

message RespondToEventRequest {
  string event_id = 1;  // CalendarEvent.id
  string status = 2;    // "ACCEPTED" | "TENTATIVE" | "DECLINED"
}

message EventList {
  repeated CalendarEvent events = 1; // sorted by start
}

message ListContactsRequest {
  string query = 1;     // matches name, email or organization; "" = all
  uint32 limit = 2;     // default 1000
  bool email_only = 3;  // only contacts with an email address (composer autocomplete)
}

message Contact {
  string id = 1;
  string account_id = 2;
  string address_book_id = 3;
  string full_name = 4;
  repeated string emails = 5;
  repeated string phones = 6;
  string organization = 7;
  bool read_only = 8; // its address book cannot be written
}

message SaveContactRequest {
  string contact_id = 1;  // "" = new contact
  string account_id = 2;  // for new contacts: whose address book
  string full_name = 3;
  repeated string emails = 4;
  repeated string phones = 5;
  string organization = 6;
}

message ContactRequest {
  string contact_id = 1;
}

message AddressMessagesRequest {
  repeated string addresses = 1;
  uint32 limit = 2; // default 20, max 200
}

message ContactList {
  repeated Contact contacts = 1;
}
